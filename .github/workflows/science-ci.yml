name: Scientific smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main model atlas smoke tests
        run: node tests/smoke.cjs
      - name: Visual physics numerical tests
        run: node tests/studio_smoke.cjs
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check studio-engine.js
          node --check studio.js
