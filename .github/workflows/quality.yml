name: COSMOS LAB — Scientific Workbench CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    name: Model catalogue and asset checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check numeric model catalogue, assets and workbench methods
        run: node tests/smoke.cjs
      - name: Check Python model builder syntax
        run: python -m py_compile build_models.py
