name: Frontier Questions scientific checks
on:
  push:
    paths:
      - 'frontier-core.js'
      - 'frontier.js'
      - 'frontier.html'
      - 'frontier.css'
      - 'tests/frontier_smoke.cjs'
      - '.github/workflows/frontier-validation.yml'
  pull_request:
    paths:
      - 'frontier-core.js'
      - 'frontier.js'
      - 'frontier.html'
      - 'frontier.css'
      - 'tests/frontier_smoke.cjs'
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c
        with:
          node-version: '22'
      - run: node tests/frontier_smoke.cjs
