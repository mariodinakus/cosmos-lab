name: Reality Engine numerical integrity
on:
  push:
    paths:
      - 'reality-core.js'
      - 'reality.js'
      - 'reality.css'
      - 'reality.html'
      - 'tests/reality-smoke.cjs'
      - '.github/workflows/reality-validation.yml'
  pull_request:
    paths:
      - 'reality-core.js'
      - 'reality.js'
      - 'reality.css'
      - 'reality.html'
      - 'tests/reality-smoke.cjs'
permissions:
  contents: read
jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c
        with:
          node-version: '22'
      - run: node tests/reality-smoke.cjs
